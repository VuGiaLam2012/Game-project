<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wave Test</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.9);
        --panel-border: rgba(148, 163, 184, 0.25);
        --text: #e2e8f0;
        --accent: #22c55e;
        --accent-2: #f59e0b;
        --danger: #ef4444;
        --path: #34d399;
        --ground: #111827;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #172554 0%, #0f172a 45%, #020817 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .shell {
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }

      canvas {
        width: 800px;
        height: 480px;
        display: block;
        background: var(--ground);
        border: 4px solid rgba(148, 163, 184, 0.25);
        border-radius: 12px;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
      }

      .panel {
        width: 220px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        padding: 12px;
        box-shadow: 0 8px 18px rgba(0,0,0,0.2);
      }

      .stat {
        display: flex;
        justify-content: space-between;
        margin: 10px 0;
        font-weight: 700;
      }

      button {
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 11px 12px;
        font-weight: 700;
        cursor: pointer;
        color: white;
        margin-bottom: 10px;
        background: linear-gradient(135deg, var(--accent), #16a34a);
      }

      button:hover { filter: brightness(1.05); }

      .tower-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 8px;
      }

      .tower-btn {
        width: auto;
        padding: 8px 10px;
        font-size: 12px;
        border: 2px solid transparent;
      }

      .tower-btn.selected {
        border-color: white;
        box-shadow: 0 0 0 2px rgba(255,255,255,0.25);
      }

      .legend {
        margin-top: 10px;
        font-size: 12px;
        color: #cbd5e1;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <canvas id="gameCanvas" width="800" height="480"></canvas>

      <div class="panel">
        <button id="startWaveBtn">Start Wave</button>

        <div class="stat"><span>Wave</span><span id="waveValue">0</span></div>
        <div class="stat"><span>Money</span><span id="moneyValue">1000</span></div>
        <div class="stat"><span>Lives</span><span id="livesValue">10</span></div>

        <div class="legend">
          <strong>Wave rule:</strong><br />
          Wave 1: 5 zombie<br />
          Mỗi con đầu: 6 HP<br />
          Sau mỗi wave: +3 zombie<br />
          HP × 0.75 mỗi wave
        </div>

        <div class="tower-list" id="towerList"></div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const startWaveBtn = document.getElementById('startWaveBtn');
      const waveValueEl = document.getElementById('waveValue');
      const moneyValueEl = document.getElementById('moneyValue');
      const livesValueEl = document.getElementById('livesValue');
      const towerListEl = document.getElementById('towerList');

      const GRID = 40;
      const COLS = canvas.width / GRID;
      const ROWS = canvas.height / GRID;

      const path = [
        { x: 0, y: 6 }, { x: 1, y: 6 }, { x: 2, y: 6 }, { x: 3, y: 6 }, { x: 4, y: 6 },
        { x: 5, y: 6 }, { x: 6, y: 6 }, { x: 7, y: 6 }, { x: 8, y: 6 }, { x: 9, y: 6 },
        { x: 10, y: 6 }, { x: 11, y: 6 }, { x: 12, y: 6 }, { x: 13, y: 6 }, { x: 14, y: 6 },
        { x: 15, y: 6 }, { x: 15, y: 4 }, { x: 16, y: 4 }, { x: 17, y: 4 }, { x: 18, y: 4 },
        { x: 18, y: 7 }, { x: 19, y: 7 }
      ];

      const state = {
        money: 1000,
        lives: 10,
        wave: 0,
        running: false,
        selectedTower: 'scout',
        enemies: [],
        towers: [],
        bullets: [],
        timerIds: [],
        lastTime: performance.now()
      };

      const towerDefs = [
        { id: 'scout', name: 'Scout', cost: 50, color: '#8b5cf6', dmg: 12, range: 110, fireRate: 1.2 },
        { id: 'rifle', name: 'Rifle', cost: 80, color: '#3b82f6', dmg: 18, range: 140, fireRate: 1.6 },
        { id: 'shot', name: 'Shot', cost: 120, color: '#f59e0b', dmg: 26, range: 120, fireRate: 0.9 }
      ];

      function updateHud() {
        waveValueEl.textContent = String(state.wave);
        moneyValueEl.textContent = String(state.money);
        livesValueEl.textContent = String(state.lives);
      }

      function renderTowerButtons() {
        towerListEl.innerHTML = '';
        towerDefs.forEach((tower) => {
          const btn = document.createElement('button');
          btn.className = 'tower-btn' + (state.selectedTower === tower.id ? ' selected' : '');
          btn.style.background = tower.color;
          btn.textContent = `${tower.name} ($${tower.cost})`;
          btn.addEventListener('click', () => {
            state.selectedTower = tower.id;
            renderTowerButtons();
          });
          towerListEl.appendChild(btn);
        });
      }

      function clearTimers() {
        state.timerIds.forEach((id) => clearTimeout(id));
        state.timerIds = [];
      }

      function buildEnemy(wave) {
        const hp = Number((6 * Math.pow(0.75, wave - 1)).toFixed(2));
        const speed = 42 + wave * 3.5;
        const enemy = {
          x: path[0].x * GRID + GRID / 2,
          y: path[0].y * GRID + GRID / 2,
          hp,
          maxHp: hp,
          speed,
          reward: 10,
          progress: 0,
          dead: false,
          hitFlash: 0,
          walkTime: 0,
          bodyColor: '#7ecb5b'
        };
        state.enemies.push(enemy);
      }

      function spawnWave() {
        clearTimers();
        const wave = state.wave + 1;
        const count = 5 + (wave - 1) * 3;
        const spawnGap = Math.max(280, 850 - wave * 40);

        state.running = true;
        state.wave = wave;
        updateHud();

        for (let i = 0; i < count; i++) {
          const id = setTimeout(() => {
            buildEnemy(wave);
            const idx = state.timerIds.indexOf(id);
            if (idx >= 0) state.timerIds.splice(idx, 1);
          }, i * spawnGap);
          state.timerIds.push(id);
        }
      }

      function placeTowerAtCell(col, row) {
        const towerDef = towerDefs.find((t) => t.id === state.selectedTower);
        if (!towerDef) return;
        if (state.money < towerDef.cost) return;

        const occupied = state.towers.some((tower) => tower.col === col && tower.row === row);
        if (occupied) return;

        const onPath = path.some((point) => point.x === col && point.y === row);
        if (onPath) return;

        state.money -= towerDef.cost;
        state.towers.push({
          col,
          row,
          x: col * GRID + GRID / 2,
          y: row * GRID + GRID / 2,
          color: towerDef.color,
          dmg: towerDef.dmg,
          range: towerDef.range,
          fireRate: towerDef.fireRate,
          cooldown: 0
        });
        updateHud();
      }

      function findClosestTarget(tower) {
        let best = null;
        let bestDist = Infinity;
        for (const enemy of state.enemies) {
          if (enemy.dead) continue;
          const dx = enemy.x - tower.x;
          const dy = enemy.y - tower.y;
          const dist = Math.hypot(dx, dy);
          if (dist <= tower.range && dist < bestDist) {
            bestDist = dist;
            best = enemy;
          }
        }
        return best;
      }

      function addBullet(fromX, fromY, target) {
        state.bullets.push({
          x: fromX,
          y: fromY,
          target,
          speed: 420,
          radius: 4,
          color: '#f8fafc',
          dead: false
        });
      }

      function update(dt) {
        for (const tower of state.towers) {
          tower.cooldown -= dt;
          const target = findClosestTarget(tower);
          if (target && tower.cooldown <= 0) {
            tower.cooldown = 1 / tower.fireRate;
            addBullet(tower.x, tower.y, target);
          }
        }

        for (const bullet of state.bullets) {
          if (bullet.dead) continue;
          if (!bullet.target || bullet.target.dead) {
            bullet.dead = true;
            continue;
          }

          const dx = bullet.target.x - bullet.x;
          const dy = bullet.target.y - bullet.y;
          const dist = Math.hypot(dx, dy);
          const step = bullet.speed * dt;

          if (dist <= step) {
            bullet.target.hp -= 12;
            bullet.target.hitFlash = 0.18;
            if (bullet.target.hp <= 0) {
              bullet.target.dead = true;
              state.money += 10;
            }
            bullet.dead = true;
          } else {
            bullet.x += (dx / dist) * step;
            bullet.y += (dy / dist) * step;
          }
        }

        for (const enemy of state.enemies) {
          if (enemy.dead) continue;
          enemy.hitFlash = Math.max(0, enemy.hitFlash - dt * 2.5);
          enemy.walkTime += dt * 7;

          let progress = enemy.progress;
          let index = Math.floor(progress);
          const next = path[index + 1];

          if (!next) {
            enemy.dead = true;
            state.lives -= 1;
            if (state.lives <= 0) {
              state.lives = 0;
              state.running = false;
              alert('Game Over');
              resetGame();
            }
            updateHud();
            continue;
          }

          const a = path[index];
          const b = next;
          const t = progress - index;
          const x1 = a.x * GRID + GRID / 2;
          const y1 = a.y * GRID + GRID / 2;
          const x2 = b.x * GRID + GRID / 2;
          const y2 = b.y * GRID + GRID / 2;

          enemy.x = x1 + (x2 - x1) * t;
          enemy.y = y1 + (y2 - y1) * t;
          enemy.progress += (enemy.speed * dt) / GRID;
        }

        state.enemies = state.enemies.filter((enemy) => !enemy.dead);
        state.bullets = state.bullets.filter((bullet) => !bullet.dead);

        if (state.running && state.timerIds.length === 0 && state.enemies.length === 0) {
          state.running = false;
          if (state.wave >= 1) {
            state.money += 35 + state.wave * 10;
          }
          updateHud();
        }
      }

      function drawPath() {
        ctx.fillStyle = '#111827';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let x = 0; x <= COLS; x++) {
          ctx.strokeStyle = 'rgba(255,255,255,0.08)';
          ctx.beginPath();
          ctx.moveTo(x * GRID, 0);
          ctx.lineTo(x * GRID, canvas.height);
          ctx.stroke();
        }

        for (let y = 0; y <= ROWS; y++) {
          ctx.strokeStyle = 'rgba(255,255,255,0.08)';
          ctx.beginPath();
          ctx.moveTo(0, y * GRID);
          ctx.lineTo(canvas.width, y * GRID);
          ctx.stroke();
        }

        ctx.fillStyle = '#34d399';
        ctx.shadowColor = '#34d399';
        ctx.shadowBlur = 12;
        for (const p of path) {
          ctx.fillRect(p.x * GRID + 3, p.y * GRID + 3, GRID - 6, GRID - 6);
        }
        ctx.shadowBlur = 0;
      }

      function drawEnemy(enemy) {
        const dirX = enemy.x - (enemy.prevX ?? enemy.x);
        const dirY = enemy.y - (enemy.prevY ?? enemy.y);
        const angle = Math.atan2(dirY, dirY || 0);
        const swing = Math.sin(enemy.walkTime) * 8;
        const bob = Math.sin(enemy.walkTime * 1.8) * 3;

        enemy.prevX = enemy.x;
        enemy.prevY = enemy.y;

        ctx.save();
        ctx.translate(enemy.x, enemy.y + bob);
        ctx.rotate(angle || 0);

        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(0, 18, 18, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#7ecb5b';
        ctx.fillRect(-14, -9, 28, 22);
        ctx.fillStyle = '#a7f3d0';
        ctx.fillRect(-7, -24, 14, 14);
        ctx.fillStyle = '#111827';
        ctx.fillRect(-5, -22, 4, 6);
        ctx.fillRect(2, -22, 4, 6);

        ctx.strokeStyle = '#2e7d32';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-8, 14);
        ctx.lineTo(-8 + swing, 26);
        ctx.moveTo(8, 14);
        ctx.lineTo(8 - swing, 26);
        ctx.stroke();

        if (enemy.hitFlash > 0) {
          ctx.fillStyle = `rgba(255,255,255,${enemy.hitFlash})`;
          ctx.fillRect(-18, -26, 36, 46);
        }

        ctx.restore();

        const hpRatio = Math.max(0, enemy.hp / enemy.maxHp);
        ctx.fillStyle = '#111827';
        ctx.fillRect(enemy.x - 18, enemy.y - 30, 36, 6);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(enemy.x - 18, enemy.y - 30, 36 * hpRatio, 6);
      }

      function drawTower(tower) {
        const cx = tower.x;
        const cy = tower.y;

        ctx.fillStyle = 'rgba(15,23,42,0.5)';
        ctx.beginPath();
        ctx.ellipse(cx, cy + 10, 18, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = tower.color;
        ctx.beginPath();
        ctx.arc(cx, cy, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#dbeafe';
        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + 18, cy - 10);
        ctx.stroke();
      }

      function drawBullet(bullet) {
        ctx.fillStyle = bullet.color;
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      function draw() {
        drawPath();

        for (const tower of state.towers) drawTower(tower);
        for (const bullet of state.bullets) drawBullet(bullet);
        for (const enemy of state.enemies) drawEnemy(enemy);
      }

      function resetGame() {
        clearTimers();
        state.enemies = [];
        state.towers = [];
        state.bullets = [];
        state.money = 1000;
        state.lives = 10;
        state.wave = 0;
        state.running = false;
        updateHud();
      }

      function loop(timestamp) {
        const dt = Math.min(0.033, (timestamp - state.lastTime) / 1000 || 0.016);
        state.lastTime = timestamp;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      canvas.addEventListener('click', (event) => {
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        const col = Math.floor(x / GRID);
        const row = Math.floor(y / GRID);

        if (col >= 0 && row >= 0 && col < COLS && row < ROWS) {
          placeTowerAtCell(col, row);
        }
      });

      startWaveBtn.addEventListener('click', () => {
        if (state.running) return;
        spawnWave();
      });

      renderTowerButtons();
      updateHud();
      resetGame();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
